import java.util.regex.Pattern

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Read pubspec.yaml for semantic versioning
def pubspecFile = file("../../pubspec.yaml")
def pubspecContent = pubspecFile.text

// App display name (filesystem-friendly)
def appName = "HRMIS-Helper"

// Extract version (format: major.minor.patch+buildNumber)
def versionPattern = Pattern.compile(/^version:\s*(.+)$/, Pattern.MULTILINE)
def versionMatcher = versionPattern.matcher(pubspecContent)
def fullVersion = versionMatcher.find() ? versionMatcher.group(1).trim() : "1.0.0+1"

// Split version and buildNumber
def versionParts = fullVersion.split(/\+/)
def semanticVersion = versionParts[0]
def buildNumber = versionParts.length > 1 ? versionParts[1] : "1"

android {
    namespace = "com.alamaby.hrmis_helper"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.alamaby.hrmis_helper"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile = signingConfigs.debug.storeFile
            storePassword = signingConfigs.debug.storePassword
            keyAlias = signingConfigs.debug.keyAlias
            keyPassword = signingConfigs.debug.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

// Rename APK outputs in build/app/outputs/flutter-apk/ after Flutter copies them.
// Flutter copies the original app-*.apk into flutter-apk/ after gradle's
// own output is produced, so renaming happens in a post-build task below.
afterEvaluate {
    def renameTask = tasks.register('renameFlutterApks') {
        group = 'flutter'
        description = 'Rename APK files in build/app/outputs/flutter-apk/ with app name and version from pubspec.yaml.'
        doLast {
            def apkDir = file("${project.buildDir}/outputs/flutter-apk")
            if (!apkDir.exists()) {
                println "[APK Rename] Directory not found: ${apkDir}"
                return
            }

            def allFiles = apkDir.listFiles()
            if (allFiles == null || allFiles.length == 0) {
                println "[APK Rename] No files found in ${apkDir}"
                return
            }

            def alreadyRenamedPrefix = "${appName}-v"
            def appPrefixPattern = ~/^app-/

            int renamedCount = 0
            allFiles.each { apkFile ->
                def originalName = apkFile.name
                if (!(originalName.endsWith('.apk') && !originalName.endsWith('.apk.sha1'))) {
                    return
                }
                if (originalName.startsWith(alreadyRenamedPrefix)) {
                    println "[APK Rename] Already renamed, skipping: ${originalName}"
                    return
                }

                def renamed = originalName.replaceFirst(
                    appPrefixPattern,
                    "${appName}-v${semanticVersion}(${buildNumber})-"
                )
                def target = new File(apkDir, renamed)

                if (apkFile.renameTo(target)) {
                    println "[APK Rename] ${originalName} -> ${renamed}"
                    renamedCount += 1
                } else {
                    println "[APK Rename] Failed to rename: ${originalName}"
                }
            }

            if (renamedCount == 0) {
                println "[APK Rename] No APK files needed renaming"
            }
        }
    }

    // Trigger rename after any assemble variant or top-level build task.
    tasks.matching {
        it.name == 'assemble' ||
            it.name == 'build' ||
            (it.name.startsWith('assemble') && it.name != 'assemble')
    }.configureEach {
        finalizedBy renameTask
    }
}
